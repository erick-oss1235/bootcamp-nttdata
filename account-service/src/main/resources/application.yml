spring:
    application:
        name: account-service
    config:
        import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

server:
    port: 8082
spring.data.mongodb.uri: ${ACCOUNT_SERVICE_MONGO_URI:mongodb://localhost:27017/account_service}
banking.customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
banking.credit-service-url: ${CREDIT_SERVICE_URL:http://localhost:8083}
