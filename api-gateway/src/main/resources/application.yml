server:
    port: 8080
spring:
    application:
        name: api-gateway
    config:
        import: optional:configserver:http://localhost:8888
    cloud:
        gateway:
            routes:
                - id: customer
                  uri: lb://customer-service
                  predicates: [Path=/api/v1/customers/**]
                - id: accounts
                  uri: lb://account-service
                  predicates: [Path=/api/v1/accounts/**]
                - id: credits
                  uri: lb://credit-service
                  predicates: [Path=/api/v1/credits/**]
                - id: wallet
                  uri: lb://wallet-service
                  predicates: [Path=/api/v1/wallets/**]
                - id: debit
                  uri: lb://debit-card-service
                  predicates: [Path=/api/v1/debit-cards/**]
                - id: identity
                  uri: lb://identity-service
                  predicates: [Path=/api/v1/auth/**]
eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
banking:
    jwt-secret: ${JWT_SECRET:CHANGE_ME_DEVELOPMENT_ONLY_32_CHAR_SECRET_123456}
