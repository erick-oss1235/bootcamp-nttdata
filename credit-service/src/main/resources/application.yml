spring:
    application:
        name: credit-service
    config:
        import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

server:
    port: 8083
spring.data.mongodb.uri: ${CREDIT_SERVICE_MONGO_URI:mongodb://localhost:27017/credit_service}
banking.customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
